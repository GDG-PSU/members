; GDG@PSU kiosk reader/writer — ESP32 + PN532.
;
; Pinned toolchains/libraries. Verify these versions against their release notes
; before a production flash; do not float to "latest" during an event.
;
; Hardware-in-the-loop validation is NOT completed (see docs/hardware-bringup.md).

[platformio]
default_envs = esp32dev
src_dir = src
lib_dir = lib

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = dio
build_unflags = -std=gnu++11
build_flags =
  -std=gnu++17
  -Wall
  -Wextra
  -DCORE_DEBUG_LEVEL=0
  -DGDG_FIRMWARE_VERSION=\"1.0.0\"
  -DGDG_SERIAL_BAUD=115200
lib_deps =
  adafruit/Adafruit PN532@1.3.4
  bblanchon/ArduinoJson@7.4.2
test_ignore = test/host
