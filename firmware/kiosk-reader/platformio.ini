; GDG@PSU NFC reader — ESP32 + PN532, over USB or Bluetooth.
;
; Pinned toolchains/libraries. Verify these versions against their release notes
; before a production flash; do not float to "latest" during an event.
;
; Hardware status and what remains unverified: see docs/hardware-bringup.md.

[platformio]
default_envs = esp32dev
src_dir = src
lib_dir = lib

[env:esp32dev]
platform = espressif32@6.9.0
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
board_build.flash_mode = dio
build_unflags = -std=gnu++11
build_flags =
  -I include
  -std=gnu++17
  -Wall
  -Wextra
  -DCORE_DEBUG_LEVEL=0
  -DGDG_FIRMWARE_VERSION=\"2.1.0\"
  -DGDG_SERIAL_BAUD=115200
  ; The reader is only ever a Bluetooth peripheral, for one computer at a time.
  -DCONFIG_BT_NIMBLE_ROLE_CENTRAL_DISABLED
  -DCONFIG_BT_NIMBLE_ROLE_OBSERVER_DISABLED
  -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=1
lib_deps =
  adafruit/Adafruit PN532@1.3.4
  bblanchon/ArduinoJson@7.4.2
  h2zero/NimBLE-Arduino@1.4.3
test_ignore = test/host
