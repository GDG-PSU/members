name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.5.1
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck
      - name: Unit tests
        run: pnpm test
      - name: Firmware URL parser host test
        run: |
          g++ -std=c++17 -Wall -Wextra -Werror \
            -I firmware/kiosk-reader/lib/ndef_url \
            firmware/kiosk-reader/test/host/test_ndef_url.cpp \
            firmware/kiosk-reader/lib/ndef_url/ndef_url.cpp \
            -o /tmp/ndef_test
          /tmp/ndef_test
      - name: Build
        run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          NEXT_PUBLIC_SUPPORT_EMAIL: gdg@psu.edu
          NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
          SUPABASE_SECRET_KEY: ci-placeholder-secret-key
          CARD_WRITE_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
